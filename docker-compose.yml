services:
  vectormorph-example:
    build:
      context: .
      dockerfile: example_database/database.Dockerfile
    restart: always
    container_name: vectormorph-example
    env_file:
      - .env
    volumes:
      - vectormorph-data:/data
    environment:
      - VECTORMORPH_DATA_DIR=/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4440/health/')"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - '4440:4440'
  client-example:
    build:
      context: ./example_client
      dockerfile: client.Dockerfile
    restart: always
    container_name: client-example
    env_file:
      - .env
    depends_on:
      vectormorph-example:
        condition: service_healthy
    ports:
      - '80:80'

volumes:
  vectormorph-data:
