services:
  vectormorph-example:
    build:
      context: ./example_database
      dockerfile: database.Dockerfile
    restart: always
    container_name: vectormorph-example
    env_file:
      - .env
    volumes:
      - vectormorph-data:/data
    environment:
      - VECTORMORPH_DATA_DIR=/data
    ports:
      - '4440:4440'
  client-example:
    build:
      context: ./example_client
      dockerfile: client.Dockerfile
    restart: always
    container_name: client-example
    env_file:
      - .env
    depends_on:
      - vectormorph-example
    ports:
      - '80:80'

volumes:
  vectormorph-data:
