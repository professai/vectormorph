[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectormorph"
version = "0.5.0"
description = "A lightweight vector database."
readme = "README.md"
authors = [{ name = "Collin Paran" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "hnswlib",
    "numpy",
    "requests",
    "uvicorn",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[project.scripts]
vectormorph = "vectormorph.vector_morph:main"
serve = "vectormorph.vector_morph:main"

[project.urls]
Homepage = "https://github.com/professai/vectormorph"

[tool.setuptools.packages.find]
include = ["vectormorph*"]

[tool.setuptools.package-data]
vectormorph = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic
